name: Deploy VFR versions to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml', '.github/workflows/validate-v2.yml']
  workflow_dispatch:
  workflow_run:
    workflows: [Validate VFR Studio, Validate VFR Atelier, Validate VFR Atelier v3]
    branches: [v1, v2, v3]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: vfr-github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [v1, v2, v3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == matrix.version && github.event.workflow_run.head_sha || format('refs/heads/{0}', matrix.version) }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run stage:models
      - run: npm run build
      - name: Record deployed source
        run: git rev-parse HEAD > dist/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vfr-pages-${{ matrix.version }}
          path: dist/
          retention-days: 3

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vfr-pages-*
          path: releases
      - name: Retain the root and version routes
        shell: bash
        run: |
          mkdir -p pages/v1 pages/v2 pages/v3
          cp -a releases/vfr-pages-v1/. pages/
          cp -a releases/vfr-pages-v1/. pages/v1/
          cp -a releases/vfr-pages-v2/. pages/v2/
          cp -a releases/vfr-pages-v3/. pages/v3/
          touch pages/.nojekyll
          test -s pages/v1/index.html
          test -s pages/v2/index.html
          test -s pages/v3/index.html
          cmp pages/source-commit.txt pages/v1/source-commit.txt
          test -s pages/v2/runtime/face.task
          test -s pages/v2/runtime/mask.tflite
          test -s pages/v2/protocol/atelier-scanned.zip
          test -s pages/v3/runtime/pose.task
          test -s pages/v3/runtime/face.task
          test -s pages/v3/runtime/mask.tflite
          test -s pages/v3/protocol/atelier-scanned.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

  deploy:
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
