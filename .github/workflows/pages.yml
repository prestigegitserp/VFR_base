name: Validate VFR Studio

on:
  push:
    branches: [v1]

permissions:
  contents: read

concurrency:
  group: vfr-studio-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run stage:models
      - run: npm run build
      - name: Install Chromium for browser checks
        run: npx playwright install --only-shell chromium
      - name: Exercise photo and webcam fitting
        shell: bash
        run: |
          mkdir -p .render
          curl --fail --silent --show-error --retry 2 https://storage.googleapis.com/mediapipe-assets/pose.jpg -o .render/pose-fixture.jpg
          node tests/y4m-fixture.mjs .render/pose-fixture.jpg .render/webcam-fixture.y4m
          node tests/browser.mjs .render/pose-fixture.jpg .render/webcam-fixture.y4m
