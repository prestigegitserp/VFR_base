name: Validate VFR Studio

on:
  push:
    branches: [v1]

permissions:
  contents: read

concurrency:
  group: vfr-studio-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run stage:models
      - run: npm run build
      - name: Install Chromium for browser checks
        run: |
          npx playwright install --with-deps --only-shell chromium
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Exercise photo and webcam fitting
        shell: bash
        run: |
          mkdir -p .render
          curl --fail --silent --show-error --retry 2 https://storage.googleapis.com/mediapipe-assets/pose.jpg -o .render/pose-fixture.jpg
          ffmpeg -loglevel error -loop 1 -i .render/pose-fixture.jpg -vf 'scale=960:540:force_original_aspect_ratio=decrease,pad=960:540:(ow-iw)/2:(oh-ih)/2' -t 1 -r 20 -pix_fmt yuv420p .render/webcam-fixture.y4m
          node tests/browser.mjs .render/pose-fixture.jpg .render/webcam-fixture.y4m
